# ETAPA 1 — puerto 80. Se inserta ANTES de pedir el certificado.
# El bloque 443 no puede existir todavía: nginx no arranca si apunta a un certificado
# que no está en disco. Por eso primero va solo este, que habilita la validación.
#
#   ./deploy/add-to-nginx.sh deploy/nginx-lopiana-80.conf

server {
    listen 80;
    server_name lopianaclothes.com www.lopianaclothes.com;

    # Por acá valida Let's Encrypt. Va ANTES del redirect: si no, el desafío se redirige
    # a https (que todavía no existe) y la emisión falla.
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/certbot-webroot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
