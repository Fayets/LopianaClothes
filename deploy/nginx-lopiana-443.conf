# ETAPA 2 — puerto 443. Se inserta DESPUÉS de que certbot emitió el certificado.
#
#   ./deploy/add-to-nginx.sh deploy/nginx-lopiana-443.conf

server {
    listen 443 ssl;
    server_name lopianaclothes.com www.lopianaclothes.com;

    ssl_certificate     /etc/letsencrypt/live/lopianaclothes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lopianaclothes.com/privkey.pem;

    # El client_max_body_size global del archivo es 15m y una foto de iPhone lo pasa.
    # Acá sube a 30m SOLO para la tienda: Coquetines sigue con su 15m.
    client_max_body_size 30m;

    location / {
        proxy_pass http://lopiana:8020;

        # Host es obligatorio: la app valida el dominio contra LOPIANA_HOSTS. Sin esta
        # línea nginx mandaría "lopiana" como Host y todo respondería 400.
        proxy_set_header Host              $host;

        # Sin X-Forwarded-For la app ve a todos los visitantes como una sola IP, y el
        # límite de intentos de login bloquearía a todo el mundo junto.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
